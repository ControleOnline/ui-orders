# Controle Online — deploy pipeline (web + android + lg-webOS).
# Único pipeline Controle Online.
# 1) configure → ambiente
# 2) web (dev / staging / master)
# 3) android AAB+APK + lg-webOS (somente master — sem staging)
# Produção NÃO dispara no push de master — só cron segunda 08:00 America/Sao_Paulo + dispatch.
name: Deploy

on:
  push:
    branches: [dev, staging]
  schedule:
    # Segunda 08:00 America/Sao_Paulo (UTC-3, sem DST) = 11:00 UTC
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        required: true
        type: choice
        options: [dev, staging, master]
      force_deploy:
        description: "Publicação humana autorizada sem aguardar aprovações de staging"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  configure:
    name: "1 · Configure"
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      api: ${{ steps.set.outputs.api }}
      socket: ${{ steps.set.outputs.socket }}
      domain: ${{ steps.set.outputs.domain }}
      manager_domain: ${{ steps.set.outputs.manager_domain }}
      ftp_profile: ${{ steps.set.outputs.ftp_profile }}
      publish_native: ${{ steps.set.outputs.publish_native }}
      web_app_type: ${{ steps.set.outputs.web_app_type }}
      web_matrix: ${{ steps.set.outputs.web_matrix }}
    steps:
      - id: set
        run: |
          set -e
          ENV="${{ github.event.inputs.environment || github.ref_name }}"
          case "$ENV" in
            dev)
              API=https://d.controleonline.com
              SOCK=wss://d.controleonline.com
              DOMAIN=https://dev.controleonline.com
              MANAGER_DOMAIN=https://dev.controleonline.com
              FTP=dev
              NATIVE=false
              WEB_MATRIX='{"include":[{"app_type":"MANAGER","ftp_product":"manager","app_domain":"https://dev.controleonline.com"}]}'
              ;;
            staging)
              API=https://s.controleonline.com
              SOCK=wss://s.controleonline.com
              DOMAIN=https://staging.controleonline.com
              MANAGER_DOMAIN=https://staging.controleonline.com
              FTP=staging
              NATIVE=false
              WEB_MATRIX='{"include":[{"app_type":"ADMIN","ftp_product":"admin","app_domain":"https://staging.controleonline.com"}]}'
              ;;
            master)
              API=https://api.controleonline.com
              SOCK=wss://api.controleonline.com
              DOMAIN=https://manager.controleonline.com
              MANAGER_DOMAIN=https://manager.controleonline.com
              FTP=production
              NATIVE=true
              WEB_MATRIX='{"include":[{"app_type":"MANAGER","ftp_product":"manager","app_domain":"https://manager.controleonline.com"},{"app_type":"SHOP","ftp_product":"shop","app_domain":"https://shop.controleonline.com"},{"app_type":"ADMIN","ftp_product":"admin","app_domain":"https://admin.controleonline.com"},{"app_type":"MKT","ftp_product":"mkt","app_domain":"https://mkt.controleonline.com"}]}'
              ;;
            *)
              echo "Ambiente inválido: $ENV (use dev|staging|master)"
              exit 1
              ;;
          esac
          {
            echo "env=$ENV"
            echo "api=$API"
            echo "socket=$SOCK"
            echo "domain=$DOMAIN"
            echo "manager_domain=$MANAGER_DOMAIN"
            echo "ftp_profile=$FTP"
            echo "publish_native=$NATIVE"
            echo "web_app_type=MANAGER"
            echo "web_matrix=$WEB_MATRIX"
          } >> "$GITHUB_OUTPUT"
          echo "env=$ENV native=$NATIVE api=$API"

  production-gate:
    name: "1.5 · Require staging checks"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful staging deployment and tests before production
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENV: ${{ needs.configure.outputs.env }}
          TARGET_SHA: ${{ github.sha }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy || false }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "master" ]; then
            echo "Production gate skipped for $TARGET_ENV."
            exit 0
          fi
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "Production explicitly authorized by workflow_dispatch; staging approval deferred for $TARGET_SHA."
            exit 0
          fi
          mapfile -t DEPLOYS < <(
            gh run list \
              --repo "$REPO" \
              --workflow deploy.yml \
              --branch staging \
              --limit 50 \
              --json conclusion,headSha,status,url \
              --jq '.[] | select(.status == "completed" and .conclusion == "success") | [.headSha, .url] | @tsv'
          )
          ALLOW_URL=""
          ALLOW_REASON=""
          for row in "${DEPLOYS[@]:-}"; do
            [ -z "$row" ] && continue
            CHECK_SHA="${row%%$'\t'*}"
            CHECK_URL="${row#*$'\t'}"
            if [ "$CHECK_SHA" = "$TARGET_SHA" ]; then
              ALLOW_URL="$CHECK_URL"
              ALLOW_REASON="staging deploy and tests exact SHA match ($CHECK_SHA)"
              break
            fi
            STATUS="$(
              gh api "repos/$REPO/compare/${CHECK_SHA}...${TARGET_SHA}" --jq '.status' 2>/dev/null || true
            )"
            if [ "$STATUS" = "ahead" ] || [ "$STATUS" = "identical" ]; then
              ALLOW_URL="$CHECK_URL"
              ALLOW_REASON="staging deploy and tests $CHECK_SHA is ancestor of $TARGET_SHA (compare=$STATUS)"
              break
            fi
          done
          if [ -z "$ALLOW_URL" ]; then
            echo "No successful staging Deploy (including its tests) is related to $TARGET_SHA." >&2
          fi
          if [ -z "$ALLOW_URL" ]; then
            echo "Production deploy blocked: staging Deploy must pass its test job first." >&2
            exit 1
          fi
          echo "Production deploy allowed ($ALLOW_REASON): $ALLOW_URL"

  web:
    name: "2 · Web ${{ matrix.app_type }} (${{ needs.configure.outputs.env }})"
    needs: [configure, production-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.web_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: FTP credentials (env × product)
        run: |
          set -e
          ENV_PROFILE="${{ needs.configure.outputs.ftp_profile }}"
          PRODUCT="${{ matrix.ftp_product }}"
          if [ "$ENV_PROFILE" = "production" ]; then
            case "$PRODUCT" in
              manager)
                echo "FTP_HOST=${{ secrets.FTPHOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.FTPUSER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.FTPPASS }}" >> "$GITHUB_ENV"
                ;;
              shop)
                echo "FTP_HOST=${{ secrets.SHOP_HOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.SHOP_USER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.SHOP_PASS }}" >> "$GITHUB_ENV"
                ;;
              admin)
                echo "FTP_HOST=${{ secrets.ADMIN_HOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.ADMIN_USER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.ADMIN_PASS }}" >> "$GITHUB_ENV"
                ;;
              mkt)
                echo "FTP_HOST=${{ secrets.MKT_HOST }}" >> "$GITHUB_ENV"
                echo "FTP_USER=${{ secrets.MKT_USER }}" >> "$GITHUB_ENV"
                echo "FTP_PASS=${{ secrets.MKT_PASS }}" >> "$GITHUB_ENV"
                ;;
            esac
          elif [ "$ENV_PROFILE" = "staging" ]; then
            echo "FTP_HOST=${{ secrets.STAGING_HOST }}" >> "$GITHUB_ENV"
            echo "FTP_USER=${{ secrets.STAGING_USER }}" >> "$GITHUB_ENV"
            echo "FTP_PASS=${{ secrets.STAGING_PASS }}" >> "$GITHUB_ENV"
          else
            echo "FTP_HOST=${{ secrets.DEV_HOST }}" >> "$GITHUB_ENV"
            echo "FTP_USER=${{ secrets.DEV_USER }}" >> "$GITHUB_ENV"
            echo "FTP_PASS=${{ secrets.DEV_PASS }}" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/web-export-deploy
        with:
          app_type: ${{ matrix.app_type }}
          api_entrypoint: ${{ needs.configure.outputs.api }}
          socket: ${{ needs.configure.outputs.socket }}
          domain: ${{ needs.configure.outputs.domain || matrix.app_domain }}
          remote_dir: "public_html/"
          publish_tests: ${{ needs.configure.outputs.env == 'staging' }}
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

  tests:
    name: "3 · Staging browser tests"
    needs: [configure, web]
    if: needs.configure.outputs.env == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Init recursive submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --recursive --init --checkout --force
          test -f modules/controleonline/ui-common/src/react/localStorage.js
          echo "submodule ui-common localStorage.js OK"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --legacy-peer-deps --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run staging browser tests (MANAGER/ADMIN/DELIVERY/POS) and build index
        env:
          API_ENTRYPOINT: ${{ needs.configure.outputs.api }}
          API_PLAYWRIGHT: ${{ needs.configure.outputs.api }}
          PLAYWRIGHT_API_ENTRYPOINT: ${{ needs.configure.outputs.api }}
          PLAYWRIGHT_SESSION_JSON: ${{ secrets.PLAYWRIGHT_SESSION_JSON }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_LIVE: ${{ secrets.SMOKE_LIVE }}
        run: |
          set +e
          npm run test:browser -- all
          SMOKE_EXIT=$?
          set -e

          # The index builder consumes this canonical results directory, while
          # the runner keeps its raw output isolated under .playwright-smoke-results.
          rm -rf tests/smoke/results
          mkdir -p tests/smoke/results
          cp -R .playwright-smoke-results/. tests/smoke/results/
          npm run tests:index

          if [ "$SMOKE_EXIT" -ne 0 ]; then
            echo "Browser smoke tests failed with exit $SMOKE_EXIT; publishing their reports before failing the job."
            exit "$SMOKE_EXIT"
          fi

      - name: Publish executed smoke catalog to staging web via FTP
        if: always() && hashFiles('tests/index.json') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          password: ${{ secrets.STAGING_PASS }}
          protocol: ftp
          local-dir: tests/
          server-dir: public_html/tests/
          state-name: .ftp-deploy-tests-state.json
          exclude: |
            **/smoke/**
            **/browser-smoke/**
            **/artifacts/**

      - name: Prepare tests directory on s.controleonline.com
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USER }}
          password: ${{ secrets.API_PASS }}
          port: ${{ secrets.API_PORT }}
          script_stop: true
          script: |
            set -e
            # The API account exposes public_html as its writable deployment
            # root; keep the executed suite reports available there too.
            TARGET=public_html/var/tests
            mkdir -p "$TARGET"
            chmod -R u+rwX "$TARGET"
            find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Publish executed smoke reports to s.controleonline.com
        if: always()
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USER }}
          password: ${{ secrets.API_PASS }}
          port: ${{ secrets.API_PORT }}
          source: "tests/browser-smoke/*"
          target: "public_html/var/tests/"
          strip_components: 1

      - name: Verify smoke report paths on API account
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USER }}
          password: ${{ secrets.API_PASS }}
          port: ${{ secrets.API_PORT }}
          script_stop: true
          script: |
            set -e
            echo "api_cwd=$(pwd)"
            echo "api_public_html_var_tests_reports=$(find public_html/var/tests -type f -name report.json | wc -l)"

      - name: Validate published smoke index in Chromium
        if: success()
        env:
          PLAYWRIGHT_SESSION_JSON: ${{ secrets.PLAYWRIGHT_SESSION_JSON }}
          STAGING_APP_URL: https://staging.controleonline.com
          STAGING_API_ENTRYPOINT: https://s.controleonline.com
          STAGING_EXPECTED_TESTS_MIN: '100'
          STAGING_EXPECTED_FLOWCHARTS_MIN: '1'
        run: node scripts/validate-staging-smoke-index.cjs


  android:
    name: "3 · Android ${{ matrix.app_type }}"
    needs: [configure, production-gate]
    if: needs.configure.outputs.env == 'master' && needs.configure.outputs.publish_native == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_type: CHECKOUT
            display_name: Checkout
            app_domain: https://checkout.controleonline.com
            track: internal
            release_status: draft
          - app_type: CRM
            display_name: CRM
            app_domain: https://crm.controleonline.com
            track: internal
            release_status: completed
          - app_type: DELIVERY
            display_name: Delivery
            app_domain: https://delivery.controleonline.com
            track: internal
            release_status: draft
          - app_type: MANAGER
            display_name: Gestor
            app_domain: https://manager.controleonline.com
            track: internal
            release_status: completed
          - app_type: MENU
            display_name: Menu
            app_domain: https://menu.controleonline.com
            track: internal
            release_status: completed
            changes_not_sent_for_review: "true"
            publish_play: "false"
          - app_type: POS
            display_name: PDV
            app_domain: https://pos.controleonline.com
            track: internal
            release_status: completed
          - app_type: PPC
            display_name: PCP
            app_domain: https://ppc.controleonline.com
            track: internal
            release_status: completed
          - app_type: SERVICE
            display_name: Service
            app_domain: https://service.controleonline.com
            track: internal
            release_status: completed
          - app_type: MKT
            display_name: Marketing
            app_domain: https://mkt.controleonline.com
            track: internal
            release_status: draft
            publish_play: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/android-build
        with:
          app_type: ${{ matrix.app_type }}
          display_name: ${{ matrix.display_name }}
          api_entrypoint: ${{ needs.configure.outputs.api }}
          domain: ${{ matrix.app_domain }}
          manager_app: ${{ needs.configure.outputs.manager_domain }}
          socket: ${{ needs.configure.outputs.socket }}
          build_aab: "true"
          build_apk: "true"
          publish_play: ${{ matrix.publish_play || 'true' }}
          publish_github: "true"
          bump_version_code_from_package: "true"
          play_track: ${{ matrix.track }}
          play_status: ${{ matrix.release_status }}
          play_changes_not_sent_for_review: ${{ matrix.changes_not_sent_for_review || 'false' }}
        env:
          CERT: ${{ secrets.CERT }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          GMAPS_GOOGLE_CLIENT_ID: ${{ secrets.GMAPS_GOOGLE_CLIENT_ID }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}

  lg-webos:
    name: "4 · LG webOS"
    needs: [configure, production-gate]
    if: needs.configure.outputs.env == 'master' && needs.configure.outputs.publish_native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lg-webos-build
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APPLICATION_ID: ${{ secrets.NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_TRUST_KEY: ${{ secrets.NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_BEACON: ${{ secrets.NEW_RELIC_BEACON }}
          NEW_RELIC_ERROR_BEACON: ${{ secrets.NEW_RELIC_ERROR_BEACON }}
